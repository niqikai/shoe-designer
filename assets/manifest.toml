# Asset catalog. Paths are relative to $SHOE_ASSETS_ROOT; the meshes themselves are not in git.
# toe/up: which SOURCE axes point toward the toe and up. Verified from per-quartile height
# profiles (the heel/collar end is taller than the toe end).
# commercial_use: true/false once the licence is read; leave out (unknown) until then. See issue #8.

[[asset]]
id = "sneaker_last"
role = "last"
path = "Sneaker - Zellerfeld - Template Files/sneaker_last_highpoly.stl"
