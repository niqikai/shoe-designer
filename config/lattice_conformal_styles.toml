# The three concept-board looks rebuilt with the flow-aligned LSCM chart, the integrated net sole and the outline functions (#46).
# Same engine as lattice_conformal.toml (shoe_designer.lattice_conformal). Demo defaults, not product decisions; weights use the 1.2 g/cm3 placeholder.

[defaults]
conformal = true
chart = "lscm"
sole_mode = "net"
sole_flare_mm = 3.0
sole_hole_mm = 0.0
flow_sweep = [[0.0, 0.0], [1.0, 0.0]]
flow_amp_pts = [[0.0, 1.0], [1.0, 1.0]]
flow_compress = [0.4, 2.5]
yarn_pts_z = [[0.0, 1.0], [1.0, 1.1]]

[[variant]]
name = "k1_honeycomb"
description = "style 1: irregular honeycomb 17 mm stretched along the flow, rods 2.4, rounded junctions, rolled collar, wide flat pull tab, net sole of the same family"
style = "voronoi"
pitch_mm = 17.0
jitter = 0.28
elongate = 1.6
fillet_mm = 2.5
yarn_mm = 2.4
thickness_mm = 3.4
rim_mm = 8.0
flow_cross_deg = 12.0
voxel_mm = 0.5
sole_cell_mm = 26.0
sole_density = [[0.0, 0.31], [1.0, 0.24]]
sole_pitch_mm = 10.0
sole_el = 1.2
sole_wall_rod_mm = 3.0
sole_wall_mm = 3.4
sole_ring_mm = 6.0
sole_pad_mm = 2.5
sole_pad_hole_mm = 6.0
sole_pad_hole_pitch_mm = 16.0
outline = [
  { fn = "sole_wall", sole_mm = 16.0, flare_mm = 3.0, bulge_mm = 3.0 },
  { fn = "cradle", rocker_mm = 8.0, lateral_mm = 4.0 },
  { fn = "collar_roll", rim_mm = 8.0, roll_mm = 3.0 },
  { fn = "pull_tab", width_mm = 16.0, thick_mm = 2.6, diameter_mm = 26.0 },
]

[[variant]]
name = "k2_triangle"
description = "style 2: regular equilateral triangles 14 mm, rods 2.8, solid thick rim, net sole"
style = "triangle"
pitch_mm = 14.0
yarn_mm = 2.8
thickness_mm = 3.6
rim_mm = 10.0
jitter = 0.0
fillet_mm = 0.0
voxel_mm = 0.5
sole_cell_mm = 24.0
sole_density = [[0.0, 0.31], [1.0, 0.27]]
sole_pitch_mm = 14.0
sole_el = 1.0
sole_wall_rod_mm = 2.8
sole_wall_mm = 3.6
sole_ring_mm = 7.0
sole_pad_mm = 2.8
sole_pad_hole_mm = 6.0
sole_pad_hole_pitch_mm = 18.0
outline = [
  { fn = "sole_wall", sole_mm = 16.0, flare_mm = 2.0, bulge_mm = 2.0 },
  { fn = "collar_roll", rim_mm = 10.0, roll_mm = 4.0 },
  { fn = "pull_tab", width_mm = 14.0, thick_mm = 3.0, diameter_mm = 24.0 },
]

[[variant]]
name = "k3_skeleton"
description = "style 3: few thick smooth rods (5.5) around large cells (~38 mm), strong junction fillets, coarse net sole of thick walls, round heel ring"
style = "voronoi"
pitch_mm = 38.0
jitter = 0.35
elongate = 1.3
fillet_mm = 6.0
yarn_mm = 5.5
thickness_mm = 7.5
rim_mm = 10.0
rim_thick_mm = 4.0
heel_loop_mm = 34.0
heel_loop_tube_mm = 7.0
flow_cross_deg = 8.0
voxel_mm = 0.7
sole_cell_mm = 44.0
sole_density = [[0.0, 0.26], [1.0, 0.22]]
sole_pitch_mm = 30.0
sole_el = 1.2
sole_wall_rod_mm = 5.5
sole_wall_mm = 6.0
sole_ring_mm = 9.0
sole_pad_mm = 3.0
sole_pad_hole_mm = 8.0
sole_pad_hole_pitch_mm = 28.0
outline = [
  { fn = "sole_wall", sole_mm = 16.0, flare_mm = 3.0, bulge_mm = 4.0 },
  { fn = "cradle", rocker_mm = 6.0, lateral_mm = 3.0 },
]
