[project]
name = "shoe-designer"
version = "0.1.0"
description = "Text/image to 3D-printable (FDM + TPU) shoe STL system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.4",
    "scipy>=1.11",
    "rtree>=1.2",
    "libigl>=2.6.3",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
# Fast ray queries (needed for 1M-face audits). No wheels on Linux aarch64 or macOS < 13, so optional.
fast = ["embreex>=4.4.0"]
# Intent parsing (#16): schema validation (needed by tests/test_intent.py) and the Claude API backend.
intent = ["anthropic>=0.40", "jsonschema>=4.20"]

[project.scripts]
shoe-assets = "shoe_designer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoe_designer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
