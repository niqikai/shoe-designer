[project]
name = "shoe-designer"
version = "0.1.0"
description = "Text/image to 3D-printable (FDM + TPU) shoe STL system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.4",
    "scipy>=1.11",
    "embreex>=4.4.0",
]

[project.scripts]
shoe-assets = "shoe_designer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoe_designer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
